<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Getting The Band Back Together</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top, #1a0533 0%, #0d0120 60%, #000 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: hidden;
      gap: 40px;
      padding: 20px;
    }

    /* ── Stars ── */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--min-op, 0.2); }
      50%       { opacity: var(--max-op, 1); }
    }

    /* ── Heading ── */
    .title {
      font-size: clamp(1.4rem, 4vw, 2.8rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
      background: linear-gradient(90deg, #e0aaff, #c77dff, #9d4edd, #c77dff, #e0aaff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
      position: relative;
      z-index: 1;
      text-shadow: none;
      filter: drop-shadow(0 0 18px rgba(199, 125, 255, 0.6));
    }
    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    /* ── Hourglass wrapper ── */
    .hourglass-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* SVG sizing */
    #hourglass-svg {
      width: min(340px, 82vw);
      height: auto;
      filter: drop-shadow(0 0 30px rgba(157, 78, 221, 0.55));
    }

    /* Glow pulse on the frame */
    #hg-frame {
      animation: glowPulse 3s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(157, 78, 221, 0.6)); }
      50%       { filter: drop-shadow(0 0 18px rgba(199, 125, 255, 1)); }
    }

    /* Sand in upper bulb — clip-path shrinks from bottom */
    #upper-sand {
      transform-origin: center bottom;
      transition: none;
    }

    /* Sand in lower bulb — clip-path grows from top */
    #lower-sand {
      transform-origin: center top;
      transition: none;
    }

    /* Falling sand stream */
    .sand-particle {
      position: absolute;
      border-radius: 50%;
      background: #f4c542;
      animation: fall linear infinite;
      pointer-events: none;
    }
    @keyframes fall {
      0%   { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(var(--fall-dist, 60px)); opacity: 0; }
    }

    /* ── Percentage label ── */
    .pct-label {
      margin-top: 14px;
      font-size: clamp(0.9rem, 2.5vw, 1.3rem);
      opacity: 0.75;
      letter-spacing: 0.12em;
    }

    /* ── Rotation animation for the hourglass itself (slow rock) ── */
    .hourglass-wrap {
      animation: rock 8s ease-in-out infinite;
    }
    @keyframes rock {
      0%, 100% { transform: rotate(-1.5deg); }
      50%       { transform: rotate(1.5deg); }
    }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<h1 class="title">Getting The Band Back Together</h1>

<div class="hourglass-wrap">
  <!--
    Hourglass SVG.
    Coordinate system: 200 wide × 320 tall.
    Upper bulb area (sand): roughly y=30 to y=150 (inner trapezoid).
    Lower bulb area (sand): roughly y=170 to y=290 (inner trapezoid).
    Neck midpoint: y=160, x=100.
  -->
  <svg id="hourglass-svg" viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Upper bulb clip: sand fills from the widest part DOWN to the neck -->
      <clipPath id="upper-clip">
        <rect id="upper-clip-rect" x="40" y="30" width="120" height="120" />
      </clipPath>
      <!-- Lower bulb clip: sand fills from neck UP -->
      <clipPath id="lower-clip">
        <rect id="lower-clip-rect" x="40" y="170" width="120" height="120" />
      </clipPath>
      <!-- Gradient for sand colour -->
      <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#ffe066" />
        <stop offset="100%" stop-color="#c8860a" />
      </linearGradient>
      <!-- Gradient for glass body -->
      <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="rgba(255,255,255,0.18)" />
        <stop offset="50%"  stop-color="rgba(255,255,255,0.05)" />
        <stop offset="100%" stop-color="rgba(255,255,255,0.12)" />
      </linearGradient>
      <!-- Gradient for the metal frame -->
      <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#9d4edd" />
        <stop offset="50%"  stop-color="#e0aaff" />
        <stop offset="100%" stop-color="#9d4edd" />
      </linearGradient>
      <!-- Glow filter -->
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- ── Upper sand (inside upper bulb, clipped) ── -->
    <!--
      The upper-bulb inner shape is a trapezoid:
        top edge: x=44..156, y=34
        bottom point: x=97..103, y=154
      We approximate it with a polygon and clip by upper-clip-rect.
    -->
    <g clip-path="url(#upper-clip)">
      <!-- Full upper sand shape (a wedge narrowing toward neck) -->
      <polygon id="upper-sand"
        points="44,34 156,34 103,154 97,154"
        fill="url(#sandGrad)" opacity="0.9" />
    </g>

    <!-- ── Lower sand (inside lower bulb, clipped) ── -->
    <!--
      The lower-bulb inner shape is a trapezoid:
        top point: x=97..103, y=166
        bottom edge: x=44..156, y=286
    -->
    <g clip-path="url(#lower-clip)">
      <polygon id="lower-sand"
        points="97,166 103,166 156,286 44,286"
        fill="url(#sandGrad)" opacity="0.9" />
    </g>

    <!-- ── Glass body ── -->
    <!-- Upper bulb outline -->
    <polygon id="hg-frame"
      points="36,26 164,26 103,154 97,154"
      fill="url(#glassGrad)"
      stroke="url(#frameGrad)" stroke-width="3.5"
      stroke-linejoin="round"
    />
    <!-- Lower bulb outline -->
    <polygon
      points="97,166 103,166 164,294 36,294"
      fill="url(#glassGrad)"
      stroke="url(#frameGrad)" stroke-width="3.5"
      stroke-linejoin="round"
    />
    <!-- Neck connector (tiny fill) -->
    <rect x="97" y="154" width="6" height="12"
      fill="url(#sandGrad)" opacity="0.6"/>

    <!-- ── Top cap ── -->
    <rect x="26" y="18" width="148" height="12" rx="4"
      fill="url(#frameGrad)" filter="url(#glow)"/>

    <!-- ── Bottom cap ── -->
    <rect x="26" y="290" width="148" height="12" rx="4"
      fill="url(#frameGrad)" filter="url(#glow)"/>

    <!-- ── Side pillars ── -->
    <rect x="26" y="26" width="10" height="268" rx="3"
      fill="url(#frameGrad)" opacity="0.7"/>
    <rect x="164" y="26" width="10" height="268" rx="3"
      fill="url(#frameGrad)" opacity="0.7"/>

    <!-- ── Highlight sheen on glass ── -->
    <line x1="56" y1="34" x2="98" y2="150"
      stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>
    <line x1="56" y1="280" x2="98" y2="168"
      stroke="rgba(255,255,255,0.14)" stroke-width="1.5" stroke-linecap="round"/>
  </svg>

  <!-- Falling sand particles rendered as absolutely-positioned divs over the SVG -->
  <div id="particle-host" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
</div>

<p class="pct-label" id="pct-label">Calculating…</p>

<script>
  // ── Configuration ──────────────────────────────────────────────────────────
  const START  = new Date('2026-06-12T16:00:00'); // full  (100%)
  const END    = new Date('2026-08-10T09:00:00'); // empty (0%)
  const TOTAL_MS = END - START;

  // ── Stars ──────────────────────────────────────────────────────────────────
  (function buildStars() {
    const container = document.getElementById('stars');
    for (let i = 0; i < 160; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = [
        `width:${size}px`, `height:${size}px`,
        `top:${Math.random()*100}%`, `left:${Math.random()*100}%`,
        `--dur:${(Math.random()*4+1.5).toFixed(1)}s`,
        `--delay:${(Math.random()*5).toFixed(1)}s`,
        `--min-op:${(Math.random()*0.2+0.05).toFixed(2)}`,
        `--max-op:${(Math.random()*0.6+0.4).toFixed(2)}`
      ].join(';');
      container.appendChild(s);
    }
  })();

  // ── Sand particle stream ───────────────────────────────────────────────────
  const particleHost = document.getElementById('particle-host');
  const MAX_PARTICLES = 8;

  function spawnParticle(progressFraction) {
    // Only spawn if progress > 0 and < 1 (sand is still flowing)
    if (progressFraction <= 0 || progressFraction >= 1) return;

    const svg = document.getElementById('hourglass-svg');
    const rect = svg.getBoundingClientRect();
    const hostRect = particleHost.parentElement.getBoundingClientRect();

    // Neck position in SVG coords: x=100, y=157
    // Map SVG coords → pixel position relative to host div
    const svgW = 200, svgH = 320;
    const scaleX = rect.width  / svgW;
    const scaleY = rect.height / svgH;
    const neckX = (rect.left - hostRect.left) + 100 * scaleX;
    const neckY = (rect.top  - hostRect.top)  + 157 * scaleY;

    const p = document.createElement('div');
    p.className = 'sand-particle';
    const size = Math.random() * 3 + 2;
    const fallDist = Math.random() * 20 + 15;
    const dur = (Math.random() * 0.4 + 0.35).toFixed(2);
    p.style.cssText = [
      `width:${size}px`, `height:${size}px`,
      `left:${neckX + (Math.random()*4-2)}px`,
      `top:${neckY}px`,
      `--fall-dist:${fallDist}px`,
      `animation-duration:${dur}s`
    ].join(';');
    particleHost.appendChild(p);
    setTimeout(() => p.remove(), parseFloat(dur) * 1000 + 50);
  }

  // ── Main hourglass update ──────────────────────────────────────────────────
  /*
    upperSand polygon baseline points (full sand):
      "44,34 156,34 103,154 97,154"
    When progress=1 (start, full): upper sand is at full → top y=34 (unchanged)
    When progress=0 (end, empty):  upper sand top y rises to 154 (collapsed to neck)

    We linearly interpolate the top edge y-coordinate:
      topY = 154 - (154 - 34) * progress = 154 - 120 * progress

    The x-values of the top edge also shrink proportionally (the bulb is a trapezoid).
    At full (y=34):  left x=44, right x=156
    At empty (y=154): left x=97, right x=103

    Interpolate x:
      leftX  = 97  - (97  - 44) * progress = 97  - 53 * progress
      rightX = 103 + (156 - 103) * progress = 103 + 53 * progress

    lower-clip-rect:
    At full (progress=1): lower clip starts at y=286 (nothing visible) → height=0
    At empty (progress=0): lower clip starts at y=170 → height=120 (full)
      clipY = 170 + 116 * progress   (top of clip rect)
      clipH = 286 - clipY

    upper-clip-rect:
    At full (progress=1): clip goes from y=topY to y=154 → height = 154 - topY
    At empty (progress=0): height = 0
  */

  function computeUpperSandPoints(progress) {
    const topY   = 154 - 120 * progress;
    const leftX  = 97  - 53  * progress;
    const rightX = 103 + 53  * progress;
    // Bottom is always at the neck
    return `${leftX.toFixed(1)},${topY.toFixed(1)} ${rightX.toFixed(1)},${topY.toFixed(1)} 103,154 97,154`;
  }

  function updateHourglass() {
    const now = Date.now();
    let progress; // 1 = full (start), 0 = empty (end)

    if (now <= START.getTime()) {
      progress = 1;
    } else if (now >= END.getTime()) {
      progress = 0;
    } else {
      const elapsed = now - START.getTime();
      progress = 1 - (elapsed / TOTAL_MS);
    }

    // Upper sand polygon
    document.getElementById('upper-sand').setAttribute('points', computeUpperSandPoints(progress));

    // Upper clip rect
    const upperTopY = 154 - 120 * progress;
    const upperClipH = Math.max(0, 154 - upperTopY);
    const ucr = document.getElementById('upper-clip-rect');
    ucr.setAttribute('y', upperTopY.toFixed(1));
    ucr.setAttribute('height', upperClipH.toFixed(1));

    // Lower clip rect — sand builds up from bottom
    // At progress=1 (full upper): lower is empty → clipY=286, height=0
    // At progress=0 (empty upper): lower is full → clipY=166, height=120
    const lowerClipY = 166 + 120 * progress; // 166+(120) = 286 when full; 166 when empty
    const lowerClipH = Math.max(0, 286 - lowerClipY);
    const lcr = document.getElementById('lower-clip-rect');
    lcr.setAttribute('y', lowerClipY.toFixed(1));
    lcr.setAttribute('height', lowerClipH.toFixed(1));

    // Percentage label
    const pct = Math.round(progress * 100);
    const pctLabel = document.getElementById('pct-label');
    if (progress <= 0) {
      pctLabel.textContent = "Time's up! 🎸";
    } else if (progress >= 1) {
      pctLabel.textContent = 'The adventure begins…';
    } else {
      pctLabel.textContent = `${pct}% remaining`;
    }

    // Spawn a sand particle if flowing
    if (progress > 0 && progress < 1) {
      if (particleHost.children.length < MAX_PARTICLES) {
        spawnParticle(progress);
      }
    }
  }

  // Run every ~50ms for smooth animation
  updateHourglass();
  setInterval(updateHourglass, 50);
</script>
</body>
</html>
