<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Getting The Band Back Together</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top, #1a0533 0%, #0d0120 60%, #000 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: hidden;
      gap: 40px;
      padding: 20px;
    }

    /* ── Stars ── */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--min-op, 0.2); }
      50%       { opacity: var(--max-op, 1); }
    }

    /* ── Heading ── */
    .title {
      font-size: clamp(1.4rem, 4vw, 2.8rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
      background: linear-gradient(90deg, #e0aaff, #c77dff, #9d4edd, #c77dff, #e0aaff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
      position: relative;
      z-index: 1;
      text-shadow: none;
      filter: drop-shadow(0 0 18px rgba(199, 125, 255, 0.6));
    }
    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    /* ── Hourglass wrapper ── */
    .hourglass-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: rock 9s ease-in-out infinite;
    }
    @keyframes rock {
      0%, 100% { transform: rotate(-1.2deg); }
      50%       { transform: rotate(1.2deg); }
    }

    /* SVG sizing */
    #hourglass-svg {
      width: min(340px, 82vw);
      height: auto;
      filter: drop-shadow(0 12px 30px rgba(157, 78, 221, 0.45));
      overflow: visible;
    }

    /* Glow pulse on the metal frame */
    .hg-frame {
      animation: glowPulse 3.5s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(157, 78, 221, 0.55)); }
      50%       { filter: drop-shadow(0 0 16px rgba(199, 125, 255, 0.95)); }
    }

    /* ── Percentage label ── */
    .pct-label {
      margin-top: 16px;
      font-size: clamp(0.9rem, 2.5vw, 1.3rem);
      opacity: 0.8;
      letter-spacing: 0.12em;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<h1 class="title">Getting The Band Back Together</h1>

<div class="hourglass-wrap">
  <!--
    Hourglass SVG.
    Coordinate system: 200 wide × 340 tall.

    Glass interior key Y values:
      top inner edge   : y = 36
      neck centre      : y = 170 (x = 100)
      bottom inner edge: y = 304

    The glass walls are defined ONCE as a sampled curve (see JS WALL data).
    The sand bodies trace those exact same walls, so the sand always fills the
    curved bulb edge-to-edge — only the top surface moves as time passes.
  -->
  <svg id="hourglass-svg" viewBox="0 0 200 340" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Sand colour gradient -->
      <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#ffe9a8" />
        <stop offset="45%"  stop-color="#f4c542" />
        <stop offset="100%" stop-color="#c8860a" />
      </linearGradient>

      <!-- Falling stream gradient (bright core, soft edges) -->
      <linearGradient id="streamGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#ffe9a8" stop-opacity="0.95" />
        <stop offset="100%" stop-color="#f4c542" stop-opacity="0.85" />
      </linearGradient>

      <!-- Glass body gradient -->
      <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="rgba(190,225,255,0.16)" />
        <stop offset="42%"  stop-color="rgba(255,255,255,0.03)" />
        <stop offset="58%"  stop-color="rgba(255,255,255,0.10)" />
        <stop offset="100%" stop-color="rgba(190,225,255,0.18)" />
      </linearGradient>

      <!-- Metal frame gradient -->
      <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#7b2cbf" />
        <stop offset="50%"  stop-color="#e0aaff" />
        <stop offset="100%" stop-color="#7b2cbf" />
      </linearGradient>

      <!-- Radial sheen for the cap highlights -->
      <radialGradient id="capSheen" cx="0.35" cy="0.3" r="0.8">
        <stop offset="0%"   stop-color="#f3e6ff" />
        <stop offset="100%" stop-color="#7b2cbf" />
      </radialGradient>

      <!-- Soft glow filter -->
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- Blur used to soften the sand pile surfaces / contact glow -->
      <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="1.1" />
      </filter>

      <!--
        Glass interior clip path (defensive backstop only).
        The sand now traces the walls itself, but we keep this clip so
        highlights / stream / grains can never spill outside the glass.
      -->
      <clipPath id="glass-interior">
        <path d="
          M 44,36
          C 44,86 70,150 100,170
          C 130,150 156,86 156,36
          Z
          M 100,170
          C 70,190 44,254 44,304
          L 156,304
          C 156,254 130,190 100,170
          Z
        " />
      </clipPath>
    </defs>

    <!-- ════════════════ GLASS BACK (tint behind the sand) ════════════════ -->
    <path class="glass-back" clip-path="url(#glass-interior)"
      d="M0,0 H200 V340 H0 Z" fill="url(#glassGrad)"/>

    <!-- ════════════════ SAND (paths built by JS to follow the curved walls) ═══════ -->

    <!-- Upper pile: fills the curved upper bulb from the (moving) surface to neck -->
    <path id="upper-sand" fill="url(#sandGrad)" d=""/>
    <!-- Darker funnel hollow that forms in the centre as it drains -->
    <path id="upper-funnel" fill="#b5780a" opacity="0" filter="url(#softBlur)" d=""/>
    <!-- Bright rim line on the sand surface -->
    <path id="upper-rim" fill="none" stroke="#fff3cf" stroke-width="1.6"
      stroke-linecap="round" opacity="0.85" filter="url(#softBlur)" d=""/>

    <!-- Lower heap: fills the curved lower bulb from floor up to the (rising) crest -->
    <path id="lower-sand" fill="url(#sandGrad)" d=""/>
    <!-- Highlight along the mound crest -->
    <path id="lower-crest" fill="none" stroke="#fff3cf" stroke-width="1.4"
      stroke-linecap="round" opacity="0.7" filter="url(#softBlur)" d=""/>
    <!-- Soft contact glow where the stream hits the heap (clipped to glass) -->
    <g clip-path="url(#glass-interior)">
      <ellipse id="impact-glow" cx="100" cy="300" rx="10" ry="4"
        fill="#fff3cf" opacity="0" filter="url(#softBlur)"/>
    </g>

    <!-- Falling stream + scattered grains, clipped so they stay inside glass -->
    <g clip-path="url(#glass-interior)">
      <rect id="stream" x="98.4" y="170" width="3.2" height="0"
        fill="url(#streamGrad)" filter="url(#glow)"/>
      <g id="grains"></g>
    </g>

    <!-- ════════════════ GLASS FRONT (shell + shine over the sand) ════════════════ -->

    <!-- Glass shell outline -->
    <path class="hg-frame" filter="url(#glow)"
      d="
        M 40,32
        C 40,86 68,152 100,172
        C 132,152 160,86 160,32
        M 100,172
        C 68,192 40,254 40,308
        M 100,172
        C 132,192 160,254 160,308
      "
      fill="none" stroke="url(#frameGrad)" stroke-width="3.4" stroke-linecap="round"/>

    <!-- Inner glass edge (subtle double-wall) -->
    <path
      d="
        M 45,37
        C 45,86 71,150 100,169
        C 129,150 155,86 155,37
        M 100,171
        C 71,190 45,254 45,303
        M 100,171
        C 129,190 155,254 155,303
      "
      fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

    <!-- Specular highlight sweeping down the left of each bulb -->
    <path d="M58,46 C56,84 72,134 92,160"
      fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.4"
      stroke-linecap="round" opacity="0.55"/>
    <path d="M60,296 C58,256 74,206 92,182"
      fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1.8"
      stroke-linecap="round" opacity="0.5"/>

    <!-- ════════════════ FRAME HARDWARE ════════════════ -->

    <!-- Side pillars -->
    <rect class="hg-frame" x="28" y="30" width="9" height="280" rx="4"
      fill="url(#frameGrad)" opacity="0.85"/>
    <rect class="hg-frame" x="163" y="30" width="9" height="280" rx="4"
      fill="url(#frameGrad)" opacity="0.85"/>

    <!-- Top cap -->
    <rect class="hg-frame" x="22" y="18" width="156" height="14" rx="5"
      fill="url(#capSheen)" filter="url(#glow)"/>
    <!-- Bottom cap -->
    <rect class="hg-frame" x="22" y="308" width="156" height="14" rx="5"
      fill="url(#capSheen)" filter="url(#glow)"/>

    <!-- Cap bevel highlights -->
    <rect x="26" y="20" width="148" height="3" rx="1.5" fill="rgba(255,255,255,0.45)"/>
    <rect x="26" y="310" width="148" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
  </svg>
</div>

<p class="pct-label" id="pct-label">Calculating…</p>

<script>
  // ── Configuration ────────────────────────────────────────────────────────
  const START  = new Date('2026-06-12T16:00:00'); // full  (100%)
  const END    = new Date('2026-08-10T09:00:00'); // empty (0%)
  const TOTAL_MS = END - START;

  // ── Stars ────────────────────────────────────────────────────────────────
  (function buildStars() {
    const container = document.getElementById('stars');
    for (let i = 0; i < 160; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = [
        `width:${size}px`, `height:${size}px`,
        `top:${Math.random()*100}%`, `left:${Math.random()*100}%`,
        `--dur:${(Math.random()*4+1.5).toFixed(1)}s`,
        `--delay:${(Math.random()*5).toFixed(1)}s`,
        `--min-op:${(Math.random()*0.2+0.05).toFixed(2)}`,
        `--max-op:${(Math.random()*0.6+0.4).toFixed(2)}`
      ].join(';');
      container.appendChild(s);
    }
  })();

  // ── SVG geometry constants ─────────────────────────────────────────────────
  const SVGNS  = 'http://www.w3.org/2000/svg';
  const NECK_Y = 170;          // y of the neck centre
  const NECK_X = 100;
  const UP_TOP = 36;           // top inner edge of the upper bulb
  const LO_BOT = 304;          // floor inner edge of the lower bulb

  /*
    The glass interior walls are cubic Béziers. To make the sand follow them
    exactly, we sample the RIGHT wall of each bulb into a lookup table of
    {y, halfWidth} points. The left wall is the mirror (x = NECK_X ± halfWidth).

    Upper-right wall : from neck (100,170) up to top-right (156,36)
      Bézier control points mirror the clip path:  (100,170) -> C (130,150)(156,86)(156,36)
    Lower-right wall : from neck (100,170) down to bottom-right (156,304)
      (100,170) -> C (130,190)(156,254)(156,304)
  */
  function cubic(p0, p1, p2, p3, t) {
    const mt = 1 - t;
    return mt*mt*mt*p0 + 3*mt*mt*t*p1 + 3*mt*t*t*p2 + t*t*t*p3;
  }

  // Sample N points along a bulb's right wall → array of {y, hw} sorted by y.
  function sampleWall(ctrl) {
    const pts = [];
    const N = 80;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const x = cubic(ctrl.x0, ctrl.x1, ctrl.x2, ctrl.x3, t);
      const y = cubic(ctrl.y0, ctrl.y1, ctrl.y2, ctrl.y3, t);
      pts.push({ y, hw: x - NECK_X });
    }
    pts.sort((a, b) => a.y - b.y);
    return pts;
  }

  const UPPER_WALL = sampleWall({ // neck → top-right
    x0:100, y0:170, x1:130, y1:150, x2:156, y2:86, x3:156, y3:36
  });
  const LOWER_WALL = sampleWall({ // neck → bottom-right
    x0:100, y0:170, x1:130, y1:190, x2:156, y2:254, x3:156, y3:304
  });

  // Interpolate the half-width of a wall table at an arbitrary y.
  function hwAt(table, y) {
    if (y <= table[0].y) return Math.max(0, table[0].hw);
    if (y >= table[table.length - 1].y) return Math.max(0, table[table.length - 1].hw);
    // binary search
    let lo = 0, hi = table.length - 1;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (table[mid].y < y) lo = mid; else hi = mid;
    }
    const a = table[lo], b = table[hi];
    const f = (y - a.y) / (b.y - a.y);
    return Math.max(0, a.hw + (b.hw - a.hw) * f);
  }

  // Build the RIGHT side of a sand body as a polyline that hugs the wall,
  // from yStart down to yEnd. Returns array of "x,y" strings (top→bottom).
  function wallPointsRight(table, yStart, yEnd) {
    const out = [];
    for (const p of table) {
      if (p.y >= yStart - 0.001 && p.y <= yEnd + 0.001) {
        out.push(`${(NECK_X + p.hw).toFixed(2)},${p.y.toFixed(2)}`);
      }
    }
    // Guarantee exact endpoints
    out.unshift(`${(NECK_X + hwAt(table, yStart)).toFixed(2)},${yStart.toFixed(2)}`);
    out.push(`${(NECK_X + hwAt(table, yEnd)).toFixed(2)},${yEnd.toFixed(2)}`);
    return out;
  }
  function wallPointsLeft(table, yStart, yEnd) {
    // bottom→top on the left side (mirror), for closing the polygon
    const out = [];
    const filtered = table.filter(p => p.y >= yStart - 0.001 && p.y <= yEnd + 0.001);
    filtered.reverse();
    out.push(`${(NECK_X - hwAt(table, yEnd)).toFixed(2)},${yEnd.toFixed(2)}`);
    for (const p of filtered) {
      out.push(`${(NECK_X - p.hw).toFixed(2)},${p.y.toFixed(2)}`);
    }
    out.push(`${(NECK_X - hwAt(table, yStart)).toFixed(2)},${yStart.toFixed(2)}`);
    return out;
  }

  // ── Grain pool ──────────────────────────────────────────────────────────────
  const grainsGroup = document.getElementById('grains');
  const GRAIN_COUNT = 14;
  const grains = [];
  for (let i = 0; i < GRAIN_COUNT; i++) {
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('r', (Math.random() * 0.9 + 0.6).toFixed(2));
    c.setAttribute('fill', Math.random() < 0.5 ? '#ffe9a8' : '#f4c542');
    grainsGroup.appendChild(c);
    grains.push({
      el: c,
      phase: Math.random(),
      speed: 0.6 + Math.random() * 0.8,
      drift: (Math.random() * 2 - 1) * 1.6
    });
  }

  // ── Element handles ────────────────────────────────────────────────────────
  const elUpperSand   = document.getElementById('upper-sand');
  const elUpperFunnel = document.getElementById('upper-funnel');
  const elUpperRim    = document.getElementById('upper-rim');
  const elLowerSand   = document.getElementById('lower-sand');
  const elLowerCrest  = document.getElementById('lower-crest');
  const elImpactGlow  = document.getElementById('impact-glow');
  const elStream      = document.getElementById('stream');
  const pctLabel      = document.getElementById('pct-label');

  // ── Shape builders (now follow the curved walls) ────────────────────────────

  // Upper pile: curved surface at surfaceY, walls follow UPPER_WALL down to neck.
  function buildUpperSand(surfaceY, funnelDepth) {
    const hwTop = hwAt(UPPER_WALL, surfaceY);
    const lx = NECK_X - hwTop, rx = NECK_X + hwTop;
    const dipY = surfaceY + funnelDepth;

    // Surface (curved, dipping in the centre) then DOWN the right wall to the
    // neck, across, and UP the left wall back to the surface.
    let d = `M${lx.toFixed(2)},${surfaceY.toFixed(2)} `;
    d += `Q${NECK_X},${dipY.toFixed(2)} ${rx.toFixed(2)},${surfaceY.toFixed(2)} `;
    // right wall: surfaceY → neck
    for (const p of UPPER_WALL) {
      if (p.y > surfaceY + 0.001 && p.y < NECK_Y) {
        d += `L${(NECK_X + p.hw).toFixed(2)},${p.y.toFixed(2)} `;
      }
    }
    d += `L${(NECK_X + 3).toFixed(2)},${NECK_Y} `;
    d += `L${(NECK_X - 3).toFixed(2)},${NECK_Y} `;
    // left wall: neck → surfaceY (reverse order)
    for (let i = UPPER_WALL.length - 1; i >= 0; i--) {
      const p = UPPER_WALL[i];
      if (p.y > surfaceY + 0.001 && p.y < NECK_Y) {
        d += `L${(NECK_X - p.hw).toFixed(2)},${p.y.toFixed(2)} `;
      }
    }
    d += 'Z';
    elUpperSand.setAttribute('d', d);

    elUpperRim.setAttribute('d',
      `M${lx.toFixed(2)},${surfaceY.toFixed(2)} Q${NECK_X},${dipY.toFixed(2)} ${rx.toFixed(2)},${surfaceY.toFixed(2)}`);

    if (funnelDepth > 1.5) {
      const fw = hwTop * 0.5;
      elUpperFunnel.setAttribute('d',
        `M${(NECK_X - fw).toFixed(2)},${surfaceY.toFixed(2)} ` +
        `Q${NECK_X},${(dipY + 2).toFixed(2)} ${(NECK_X + fw).toFixed(2)},${surfaceY.toFixed(2)} ` +
        `L${(NECK_X + 2).toFixed(2)},${NECK_Y} L${(NECK_X - 2).toFixed(2)},${NECK_Y} Z`);
      elUpperFunnel.setAttribute('opacity', '0.45');
    } else {
      elUpperFunnel.setAttribute('opacity', '0');
    }
  }

  // Lower heap: walls follow LOWER_WALL from floor up to crestY, capped by a
  // rounded dome. crestY is where the centre of the heap currently sits.
  function buildLowerSand(crestY) {
    const hwTopWall = hwAt(LOWER_WALL, crestY); // wall half-width at the crest line
    // The dome shoulders meet the walls a little below the crest.
    const shoulderY = Math.min(LO_BOT, crestY + (LO_BOT - crestY) * 0.30);
    const hwShoulder = hwAt(LOWER_WALL, shoulderY);
    const lxS = NECK_X - hwShoulder, rxS = NECK_X + hwShoulder;

    // Start at floor-left, up the LEFT wall to the shoulder, dome across to the
    // right shoulder, then down the RIGHT wall back to the floor.
    let d = `M${(NECK_X - hwAt(LOWER_WALL, LO_BOT)).toFixed(2)},${LO_BOT} `;
    // left wall: floor → shoulder (reverse, going up)
    for (let i = LOWER_WALL.length - 1; i >= 0; i--) {
      const p = LOWER_WALL[i];
      if (p.y < LO_BOT - 0.001 && p.y > shoulderY + 0.001) {
        d += `L${(NECK_X - p.hw).toFixed(2)},${p.y.toFixed(2)} `;
      }
    }
    d += `L${lxS.toFixed(2)},${shoulderY.toFixed(2)} `;
    // dome across (crest in the centre)
    d += `Q${NECK_X},${crestY.toFixed(2)} ${rxS.toFixed(2)},${shoulderY.toFixed(2)} `;
    // right wall: shoulder → floor
    for (const p of LOWER_WALL) {
      if (p.y > shoulderY + 0.001 && p.y < LO_BOT - 0.001) {
        d += `L${(NECK_X + p.hw).toFixed(2)},${p.y.toFixed(2)} `;
      }
    }
    d += `L${(NECK_X + hwAt(LOWER_WALL, LO_BOT)).toFixed(2)},${LO_BOT} Z`;
    elLowerSand.setAttribute('d', d);

    elLowerCrest.setAttribute('d',
      `M${lxS.toFixed(2)},${shoulderY.toFixed(2)} Q${NECK_X},${crestY.toFixed(2)} ${rxS.toFixed(2)},${shoulderY.toFixed(2)}`);
    return crestY;
  }

  // ── Main update loop ─────────────────────────────────────────────────────────
  function update(tMs) {
    const now = Date.now();
    let progress; // 1 = full (start), 0 = empty (end)
    if (now <= START.getTime())      progress = 1;
    else if (now >= END.getTime())   progress = 0;
    else                             progress = 1 - (now - START.getTime()) / TOTAL_MS;

    const flowing = progress > 0 && progress < 1;

    // Upper surface descends from UP_TOP (full) toward the neck (empty).
    const upperSurfaceY = UP_TOP + (NECK_Y - UP_TOP) * (1 - progress);
    const funnelDepth = flowing ? 7 * Math.sin(Math.PI * (1 - progress)) + 2 : 0;
    buildUpperSand(upperSurfaceY, funnelDepth);

    // Lower crest rises from the floor (empty) toward the neck (full).
    const lowerCrestY = LO_BOT - (LO_BOT - (NECK_Y + 4)) * (1 - progress);
    const crestY = buildLowerSand(lowerCrestY);

    // Falling stream from neck to the heap crest.
    if (flowing) {
      const streamTop = NECK_Y;
      const streamBottom = Math.max(crestY - 2, NECK_Y + 4);
      elStream.setAttribute('y', streamTop);
      elStream.setAttribute('height', Math.max(0, streamBottom - streamTop).toFixed(1));
      elStream.setAttribute('opacity', '1');

      const pulse = 0.35 + 0.35 * Math.abs(Math.sin(tMs / 220));
      elImpactGlow.setAttribute('cx', NECK_X);
      elImpactGlow.setAttribute('cy', (crestY + 2).toFixed(1));
      elImpactGlow.setAttribute('opacity', pulse.toFixed(2));

      const spanY = crestY - NECK_Y;
      for (const g of grains) {
        g.phase += (g.speed * (tMs - (g.last || tMs))) / 900;
        g.last = tMs;
        const f = g.phase % 1;
        const y = NECK_Y + spanY * f;
        const spread = g.drift * (0.4 + 0.6 * f);
        g.el.setAttribute('cx', (NECK_X + spread).toFixed(2));
        g.el.setAttribute('cy', y.toFixed(2));
        g.el.setAttribute('opacity', (0.9 * (1 - f * 0.5)).toFixed(2));
      }
    } else {
      elStream.setAttribute('opacity', '0');
      elImpactGlow.setAttribute('opacity', '0');
      for (const g of grains) g.el.setAttribute('opacity', '0');
    }

    // Percentage label
    const pct = Math.round(progress * 100);
    if (progress <= 0)      pctLabel.textContent = "Time's up! 🎸";
    else if (progress >= 1) pctLabel.textContent = 'The adventure begins…';
    else                    pctLabel.textContent = `${pct}% remaining`;

    requestAnimationFrame(update);
  }

  requestAnimationFrame(update);
</script>
</body>
</html>
